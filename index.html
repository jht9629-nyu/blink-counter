<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blink Counter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="status">Loading MediaPipe…</div>
  <div id="controls">
    <label>
      Threshold: <span id="threshold-val">0.08</span>
      <input type="range" id="threshold" min="0.01" max="0.40" step="0.01" value="0.08">
    </label>
    <label>
      Graph speed: <span id="graph-speed-val">2</span>
      <input type="range" id="graph-speed" min="1" max="12" step="1" value="2">
    </label>
    <button id="reset-btn">Reset counter</button>
  </div>
  <div id="graph-panel">
    <div id="graph-header">
      <span class="graph-label graph-label-left">Left score</span>
      <span class="graph-label graph-label-right">Right score</span>
    </div>
    <canvas id="graph" width="640" height="160"></canvas>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
